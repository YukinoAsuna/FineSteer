[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finesteer-moe"
version = "0.1.0"
description = "A clean MoSE-only reproduction of FineSteer for TruthfulQA."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "FineSteer MoSE contributors"}]
keywords = ["llm", "activation-steering", "mixture-of-experts", "truthfulqa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=2.18",
  "huggingface-hub>=0.26",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.scripts]
finesteer = "run_truthfulqa:main"
finesteer-evaluate = "evaluate_openai:main"
finesteer-merge = "merge_shards:main"

[tool.setuptools]
packages = ["finesteer_moe"]
py-modules = ["run_truthfulqa", "evaluate_openai", "merge_shards"]

[tool.ruff]
line-length = 120
target-version = "py310"
